name: Deploy PIC vs PAC to Netlify

on:
  workflow_dispatch:
  push:
    branches:
      - agent/add-pic-vs-pac-backtester
    paths:
      - "public/pic-vs-pac/**"
      - ".github/workflows/deploy-pic-vs-pac-netlify.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: public/pic-vs-pac
    steps:
      - name: Checkout
        uses: actions/checkout@v4

